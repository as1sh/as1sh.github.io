<!DOCTYPE html>
<html>
<head><title>Site works?</title></head>
<body>
  <h1 style="text-align:center;">Maut ke Saath Appointment Countdown!</h1>
    <div class="countdown" style="text-align: center;">
        <p id="countdownDisplay" style="font-size: 3em; font-weight: bold;">Loading...</p>
      <img src="padhai.png" alt="Padhai Likhai Karo, IAS YAS Bano" style="max-width: 90%; height: auto; margin-top: 30px;">
         </div>
  
      <h1 style="text-align:center; margin-top: 150px;">Phir Milenge!</h1>
<div class="countdown" style="text-align: center;">
      <p id="countdownDisplay2" style="font-size: 3em; font-weight: bold;">Loading...</p>
       <img src="jab.jpg" alt="Apun Idhar hi hai" style="max-width: 80%; height: auto; margin-top: 30px;">
 </div>
    
<script>
    // List of target dates in order
    const targetDates = [
        new Date("July 03, 2025 09:00:00").getTime(),
        new Date("July 04, 2025 09:00:00").getTime(),
        new Date("June 05, 2025 09:00:00").getTime(),
        new Date("June 06, 2025 09:00:00").getTime(),
        new Date("June 12, 2025 09:00:00").getTime(),
        new Date("June 13, 2025 09:00:00").getTime(),
        new Date("June 18, 2025 09:00:00").getTime() // Final countdown
    ];

    let currentIndex = 0;

    const countdown = setInterval(function () {
        const now = new Date().getTime();

        // If all countdowns are over
        if (currentIndex >= targetDates.length) {
            clearInterval(countdown);
            document.getElementById("countdownDisplay").innerHTML = "EXPIRED";
            return;
        }

        const timeLeft = targetDates[currentIndex] - now;

        if (timeLeft <= 0) {
            // Move to the next target date
            currentIndex++;
        } else {
            const hours = Math.floor(timeLeft / (1000 * 60 * 60));
            const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

            document.getElementById("countdownDisplay").innerHTML =
                `${hours}h ${minutes}m ${seconds}s`;
        }
    }, 1000);
  
       // Set the target date and time (July 19, 2025 at 14:00 PM)
        const targetDate2 = new Date("July 19, 2025 13:00:00").getTime();

        // Update the countdown every second
        const countdown2 = setInterval(function() {
            // Get the current date and time
            const now = new Date().getTime();

            // Find the remaining time
            const timeLeft = targetDate2 - now;

            // Calculate days, hours, minutes, and seconds

            const hours = Math.floor(timeLeft / (1000 * 60 * 60));
            const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

            // Display the countdown
            document.getElementById("countdownDisplay2").innerHTML = 
                `${hours}h ${minutes}m ${seconds}s`;

            // If the countdown finishes
            if (timeLeft < 0) {
                clearInterval(countdown2);
                document.getElementById("countdownDisplay2").innerHTML = "EXPIRED";
            }
        }, 1000);
    </script>
  
</body>
</html>
